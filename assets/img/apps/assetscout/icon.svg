    <!-- The application icon, rebuilt from AssetScout/AppIcon.icon: the same two
         layers (the label and the row of days), the same cream ground, drawn as
         vectors so the 30px menu row and the 46px card both stay sharp.
         The group is scaled 1.1 about the artwork's own centre (518, 533) and
         moved back to the middle of the tile. -->
