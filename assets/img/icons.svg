<svg xmlns="http://www.w3.org/2000/svg">
<!--
    Every icon the pages show inside their text, drawn once. A page shows one
    by pointing at it:

        <svg aria-hidden="true"><use href="/assets/img/icons.svg#arrow"></use></svg>

    Change a shape here and it changes on every page.

    The size and the stroke width come from the CSS of the place the icon sits
    in (.btn svg, .feature__mark svg …), not from this file. A smaller icon
    needs a slightly heavier line to look as heavy as a larger one: the arrow
    is drawn at 2 in a 16px button and at 2.2 in a 15px link. The lines take
    the colour of the text around them.

    The header's own icons (sun, moon, screen) are not here. They are part of
    the header template in tools/chrome.py, so the header needs no second
    download before it can draw.
-->

<!-- The next step: buttons, links, the app cards -->
<symbol id="arrow" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 6l6 6-6 6"/>
    </g>
</symbol>

<!-- Included: the pricing plans, the list of what changes a file -->
<symbol id="check" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
    </g>
</symbol>

<!-- The features: native, private, finished, meetings, games -->
<symbol id="display" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="14" rx="2"/>
        <path d="M8 21h8M12 18v3"/>
    </g>
</symbol>

<symbol id="shield" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l7.5 3.4v5.1c0 4.4-3.1 8.1-7.5 9.5-4.4-1.4-7.5-5.1-7.5-9.5V6.4z"/>
        <path d="M9.2 12.2l2 2 3.6-4"/>
    </g>
</symbol>

<symbol id="clock" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3 2"/>
    </g>
</symbol>

<symbol id="camera" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 10.5V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-3.5l6 3.5V7z"/>
    </g>
</symbol>

<symbol id="gamepad" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 8h11a3.5 3.5 0 0 1 3.4 4.3l-.9 4A3 3 0 0 1 15.5 17l-1.6-2h-3.8L8.5 17a3 3 0 0 1-4.5-.7l-.9-4A3.5 3.5 0 0 1 6.5 8z"/>
        <path d="M8 11v2M7 12h2M16 11.5h.01M14.5 13h.01"/>
    </g>
</symbol>
</svg>
